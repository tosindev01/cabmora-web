# Cabmora Web — local development stack (frontends only)
#
#   docker compose up --build
#
#   web   → http://localhost:5173   Vite dev server, HMR
#   admin → http://localhost:5174   Vite dev server, HMR
#
# ── The API lives in a separate repo ──────────────────────────────────────
# cabmora-api is deployed and versioned independently; the only thing shared
# between the two repos is the HTTP contract. This compose file does NOT build
# it. Pick one:
#
#   1. Run the API's own stack from the cabmora-api repo (recommended):
#        cd ../cabmora-api && docker compose up -d
#      It publishes :8000 on the host, which is what API_TARGET defaults to.
#
#   2. Point at a deployed environment instead — no local API at all:
#        API_TARGET=https://api-staging.cabmora.com docker compose up
#
# host.docker.internal resolves to the host from inside the container, which is
# how these containers reach an API running in a different compose project.

name: cabmora-web

services:
  web:
    image: node:22-alpine
    working_dir: /repo
    environment:
      VITE_PROXY_TARGET: ${API_TARGET:-http://host.docker.internal:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./:/repo
      # Anonymous volumes stop the host's node_modules (macOS binaries) from
      # shadowing the ones installed inside the container.
      - /repo/node_modules
      - /repo/apps/web/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev --workspace @cabmora/web"

  admin:
    image: node:22-alpine
    working_dir: /repo
    environment:
      VITE_PROXY_TARGET: ${API_TARGET:-http://host.docker.internal:8000}
    ports:
      - "5174:5174"
    volumes:
      - ./:/repo
      - /repo/node_modules
      - /repo/apps/admin/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev --workspace @cabmora/admin"
